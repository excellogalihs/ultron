{% from "components/icons.html" import icon %}
<header class="topbar">
  <button class="icon-btn topbar__menu" id="sidebar-toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
    {{ icon('menu', 19) }}
  </button>
  <div class="topbar__crumb">
    <span class="topbar__brand">ULTRON</span>
    <span class="topbar__slash">/</span>
    <span class="topbar__page">{{ page_title|upper }}</span>
  </div>
  <div class="topbar__right">
    <span class="topbar__date">{{ today_label }}</span>
    <span class="topbar__local"><span class="status-dot status-dot--online"></span>LOCAL</span>
    <div class="notification-center" id="notification-center">
      <button class="icon-btn notification-toggle" id="notification-toggle" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notification-panel">
        {{ icon('bell', 17) }}<span class="notification-count" id="notification-count" hidden></span>
      </button>
      <section class="notification-panel" id="notification-panel" aria-label="Notifications" hidden>
        <header class="notification-panel__head"><strong>REMINDERS</strong><button type="button" id="notification-read-all">Mark all read</button></header>
        <div class="notification-list" id="notification-list"><p class="notification-empty">No reminders yet.</p></div>
        <button class="notification-desktop" id="notification-desktop" type="button">Enable desktop notifications</button>
      </section>
    </div>
    <a class="avatar" href="{{ url_for('settings.index') }}" title="Profile & settings">{{ settings.operator_name|initials }}</a>
  </div>
</header>
